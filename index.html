<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Dash</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Neon Dash">
  <meta name="theme-color" content="#0b0b14">
  <link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
  <canvas id="c"></canvas>
  <div id="auth-modal" class="auth-modal" hidden>
    <form id="auth-form" class="auth-card">
      <h2 id="auth-title">Sign in</h2>
      <label for="auth-email">Email</label>
      <input id="auth-email" name="email" type="email" autocomplete="email" required>
      <label for="auth-password">Password</label>
      <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="6" required>
      <p id="auth-error" role="status" aria-live="polite"></p>
      <div class="auth-actions">
        <button id="auth-cancel" type="button">Cancel</button>
        <button id="auth-submit" type="submit">Sign in</button>
      </div>
    </form>
  </div>
  <input id="level-file-input" type="file" accept=".ndcl,application/json" hidden>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
  <script src="supabase-config.js?v=6"></script>
  <script src="game.js?v=6"></script>
</body>
</html>
